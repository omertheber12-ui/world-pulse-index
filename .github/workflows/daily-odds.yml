# Daily public odds. 05:00 UTC is 07:00 in Israel in November (UTC+2).
# The job commits only files under site/data/daily/, and only with the built-in token.
name: Daily odds

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Collect today's odds
        id: collect
        working-directory: site
        continue-on-error: true
        run: node scripts/collect-daily.mjs

      - name: Check the saved days
        id: check
        if: steps.collect.outcome == 'success'
        working-directory: site
        continue-on-error: true
        run: npm run check:daily

      - name: Record no update when the read or the check failed
        id: noupdate
        if: steps.collect.outcome != 'success' || steps.check.outcome != 'success'
        working-directory: site
        run: node scripts/collect-daily.mjs --no-update

      - name: Guard changed paths
        id: guard
        if: steps.noupdate.outcome == 'success' || (steps.collect.outcome == 'success' && steps.check.outcome == 'success')
        run: |
          set -eu
          bad=0
          found=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            found=1
            path="${line:3}"
            case "$path" in
              *" -> "*) path="${path##* -> }" ;;
            esac
            case "$path" in
              site/data/daily/*) ;;
              *)
                echo "changed file is outside site/data/daily/: $path"
                bad=1
                ;;
            esac
          done < <(git -c color.status=false status --porcelain=v1 -uall)
          if [ "$found" -eq 0 ]; then
            echo "no file changes"
          fi
          exit "$bad"

      - name: Commit the daily files
        if: steps.guard.outcome == 'success'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/daily
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Record daily odds for $(date -u +%F)."
          git push origin HEAD:main

      - name: Fail the job when the read or the check failed
        if: steps.collect.outcome != 'success' || steps.check.outcome == 'failure'
        run: exit 1
