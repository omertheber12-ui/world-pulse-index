<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My portfolio · World Pulse Index</title><link rel="stylesheet" href="assets/layout.css"></head><body>
<header id="top"></header><div id="timeline" class="timeline"></div><main id="main"></main><footer id="footer"></footer>
<script src="assets/snapshot.js"></script><script src="assets/data.js"></script>
<script>
WPI.start('portfolio', function () {
  var W = WPI, S = W.S, all = W.all();
  var rows = S.holdings.rows.slice().sort(function (a, b) { return b.value - a.value; });
  var sec = {}; rows.forEach(function (r) { var k = W.sectorWords(r.ticker); sec[k] = (sec[k] || 0) + r.weight; });
  document.getElementById('main').innerHTML = '<h1>My portfolio</h1><p class="sub">Read-only eToro read, ' + W.esc(S.holdings.fetched_at) + '. Total ' + W.usd(S.holdings.total) + '. Refreshes only on rebuild.</p><ul class="plain">' +
    rows.map(function (r) {
      var ev = all.map(function (s) { var p = s.parts.filter(function (x) { return x.ticker === r.ticker; })[0]; return { s: s, p: p }; })
        .filter(function (x) { return x.p && x.p.strength > 0; }).sort(function (a, b) { return b.s.attention - a.s.attention || b.p.strength - a.p.strength; }).slice(0, 2);
      return '<li><b>' + W.esc(r.name) + '</b> (' + W.esc(r.ticker) + ') · ' + W.usd(r.value) + ' · ' + r.weight.toFixed(1) + '%' +
        (ev.length ? '<div class="small">Top events by attention:</div>' + ev.map(function (x) { return '<div class="linkrow small">→ <a href="event.html?id=' + x.s.ev.event_id + '">' + W.esc(x.s.ev.title) + '</a> ' + W.pct(x.s.lead && x.s.lead.pct) + '% · ' + W.strengthWord(x.p.strength) + ' link <span class="guess">Guess</span></div>'; }).join('') : '<div class="small">No tracked event links (too small or no sector link).</div>') + '</li>';
    }).join('') + '<li>Cash · ' + W.usd(S.holdings.cash) + ' · ' + S.holdings.cash_weight.toFixed(2) + '% · no link</li></ul>' +
    '<h2>Sector shares <span class="guess">Guess</span></h2><table><tr><th>Sector (Guess)</th><th class="num">Share</th></tr>' + Object.keys(sec).sort(function (a, b) { return sec[b] - sec[a]; }).map(function (k) { return '<tr><td>' + W.esc(k) + '</td><td class="num">' + sec[k].toFixed(1) + '%</td></tr>'; }).join('') + '</table>';
});
</script></body></html>
