<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today · World Pulse Index</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="assets/layout.css"></head><body>
<header id="top"></header><div id="timeline" class="timeline"></div><main id="main"></main><footer id="footer"></footer>
<script src="assets/snapshot.js"></script><script src="assets/data.js"></script>
<script>
WPI.start('today', function () {
  var W = WPI, S = W.S, m = document.getElementById('main');
  if (W.loading) {
    m.innerHTML = '<div class="grid"><div class="hero"><div class="sk" style="width:40%;height:20px"></div><div class="sk" style="width:90%;height:30px"></div><div class="sk" style="width:60%;height:30px"></div><div class="sk" style="width:100%;height:16px"></div><div class="sk" style="width:100%;height:16px"></div><div class="sk" style="width:70%;height:16px"></div></div><div class="side"><div class="sk" style="width:50%;height:44px"></div><div class="sk" style="width:80%;height:16px"></div></div></div>' +
      '<h2>Top 3 events now</h2><p class="sub">Reading live figures…</p><div class="cards">' + W.skeletonCard() + W.skeletonCard() + W.skeletonCard() + '</div>';
    return;
  }
  var err = W.live.error ? W.errorCard() : '';
  var ranked = W.ranked().filter(function (s) { return s.lead; });
  if (!ranked.length) {
    m.innerHTML = err + '<div class="grid"><div class="hero"><div class="labels"><span class="chip green">Insight</span></div><h1>No meaningful move to report yet</h1><p class="last">Insights only, not advice.</p></div></div><h2>Top 3 events now</h2>' + W.emptyState() +
      '<div class="more"><a class="btn secondary" href="events.html">See all events</a><a class="btn secondary" href="portfolio.html">See my portfolio</a></div>';
    return;
  }
  var h = W.headline(), t = h.top, l = t.lead, top3 = ranked.slice(0, 3);
  var mv = t.move == null ? 'No 24 hour change data.' : (Math.abs(t.move) >= 5 ? (t.move > 0 ? 'Up ' : 'Down ') + Math.abs(t.move).toFixed(0) + ' points in a day: a meaningful move.' : (t.move >= 0 ? 'Up ' : 'Down ') + Math.abs(t.move).toFixed(1) + ' points in a day: no meaningful move.');
  var body = '<span class="fact">Fact</span> ' + W.esc(W.plainOutcome(t.ev, l.label)) + ' shows ' + W.pct1(l.pct) + '% (Polymarket, public data, ' + (W.live.gammaOk ? 'as of ' : 'built-in figures from ') + W.figTime() + ' Asia/Jerusalem). ' + mv +
    ' <span class="guess">Guess</span> This event could touch about ' + Math.round(t.touch) + '% of your reported portfolio, mostly ' + W.esc(t.topWords) + '.';
  m.innerHTML = err +
    '<div class="grid"><section class="hero"><div class="labels"><span class="chip green">Insight</span><span class="fact">Fact</span><span class="guess">Guess</span>' + (t.meaningful ? '<span class="chip moved">Moved</span>' : '') + '</div>' +
    '<h1>' + W.esc(h.text) + '</h1><p class="body">' + body + '</p>' +
    '<div class="touchline"><span class="nm">' + Math.round(t.touch) + '%</span><span class="ns">of your reported portfolio could be touched</span><span class="guess">Guess</span>' + (t.high ? '<span class="flag">High</span>' : '') + '</div>' +
    W.src(t.ev) + '<p class="last">Insights only, not advice.</p></section>' +
    '<aside class="side"><div class="nm">' + Math.round(t.touch) + '%</div><div class="ns">of your reported portfolio could be touched</div><div class="labels" style="margin-top:8px"><span class="guess">Guess</span>' + (t.high ? '<span class="flag">High</span>' : '') + '</div>' +
    '<div class="divider"></div><div class="caption">Attention <span class="guess">Guess</span></div><div class="nm" style="font-size:20px;line-height:24px">' + Math.round(t.attention) + '%</div><div class="caption" style="margin-top:8px">Touch × uncertainty, plus a boost for a meaningful move. <a href="how.html#attention">How it works</a></div></aside></div>' +
    '<h2>Top 3 events now</h2><p class="sub">Ranked by attention. Big number is Polymarket\'s figure for the leading option. <a href="how.html#attention">How ranking works</a></p>' +
    '<div class="cards" id="top3" data-ranking="' + ranked.map(function (s) { return s.ev.event_id + ':' + s.attention.toFixed(4); }).join(',') + '">' + top3.map(W.card).join('') + '</div>' +
    '<div class="more"><a class="btn secondary" href="events.html">See all events</a><a class="btn secondary" href="portfolio.html">See my portfolio</a></div>';
}, { waitLive: true });
</script></body></html>
